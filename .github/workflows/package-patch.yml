name: Package live candle patch
on:
  push:
    paths:
      - 'apply_live_capture_patch.py'
      - '_source_review/openbot-polarium/openbot/data/live_capture.py'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build patch ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          out = Path('/tmp/openbot-polarium-live-patch.zip')
          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              z.write('apply_live_capture_patch.py', 'apply_live_capture_patch.py')
              z.write('_source_review/openbot-polarium/openbot/data/live_capture.py', 'openbot/data/live_capture.py')
          print(f'Patch package: {out.stat().st_size} bytes')
          PY
      - name: Commit patch ZIP
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/openbot-polarium-live-patch.zip openbot-polarium-live-patch.zip
          git add openbot-polarium-live-patch.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Package targeted live candle patch'
          git push origin main
