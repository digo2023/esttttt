name: Package live Polarium build
on:
  push:
    paths:
      - '_source_review/openbot-polarium/**'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create clean project ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('_source_review/openbot-polarium')
          out = Path('/tmp/openbot-polarium-live.zip')
          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc':
                      z.write(p, Path('openbot-polarium') / p.relative_to(root))
          print(f'Created package ({out.stat().st_size} bytes)')
          PY
      - name: Commit package without binary merge conflicts
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/openbot-polarium-live.zip openbot-polarium-live.zip
          git add openbot-polarium-live.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Package live Polarium candle capture build'
          git push origin main
