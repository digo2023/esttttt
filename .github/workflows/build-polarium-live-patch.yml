name: Build Polarium live patch
on:
  push:
    paths:
      - 'apply_live_capture_patch.py'
      - '_source_review/openbot-polarium/openbot/data/live_capture.py'
      - '.github/workflows/build-polarium-live-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: |
          python -m py_compile apply_live_capture_patch.py
          python -m py_compile _source_review/openbot-polarium/openbot/data/live_capture.py
      - name: Build patch ZIP
        run: |
          mkdir -p dist/openbot/data
          cp apply_live_capture_patch.py dist/
          cp _source_review/openbot-polarium/openbot/data/live_capture.py dist/openbot/data/
          cd dist
          zip -r ../openbot-polarium-live-patch.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: openbot-polarium-live-patch
          path: openbot-polarium-live-patch.zip
          if-no-files-found: error
      - name: Publish downloadable ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openbot-polarium-live-patch.zip
          git commit -m "Build Polarium live patch package" || exit 0
          git push
