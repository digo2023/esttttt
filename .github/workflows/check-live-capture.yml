name: Validate live capture
on:
  push:
    paths:
      - '_source_review/openbot-polarium/**'
      - '.github/workflows/check-live-capture.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q _source_review/openbot-polarium/openbot
