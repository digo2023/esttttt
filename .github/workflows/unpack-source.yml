name: Unpack source for review
on:
  push:
    paths:
      - 'openbot-polarium.zip'
      - '.github/workflows/unpack-source.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract archive
        run: |
          mkdir -p _source_review
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('openbot-polarium.zip') as z:
              z.extractall('_source_review')
          PY
      - name: Commit extracted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _source_review
          git commit -m 'Temporarily expose source files for targeted fix' || exit 0
          git push
